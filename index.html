<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa Mundial FIFA 2026</title>
<style>
  :root {
    --bg:#0a0e1a; --card:#111827; --card2:#1a2235; --card3:#1e2a40;
    --border:#1e2d45; --accent:#c8a84b; --accent2:#e8c96a;
    --text:#e8eaf0; --muted:#8892a4;
    --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
    --live:#ef4444; --live2:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}

  header{background:linear-gradient(135deg,#0a0e1a 0%,#1a2235 50%,#0a0e1a 100%);border-bottom:2px solid var(--accent);padding:16px 20px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .header-left h1{font-size:1.4rem;font-weight:900;color:var(--accent);letter-spacing:2px;text-transform:uppercase;}
  .header-left p{color:var(--muted);font-size:.72rem;margin-top:2px;}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .sync-btn{background:var(--accent);border:none;color:#000;padding:7px 14px;border-radius:7px;font-size:.76rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:opacity .2s;}
  .sync-btn:hover{opacity:.85;}
  .sync-btn:disabled{opacity:.5;cursor:wait;}
  .sync-status{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  nav{display:flex;gap:5px;padding:9px 12px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:wrap;justify-content:center;}
  nav button{background:var(--card2);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.74rem;font-weight:600;transition:all .2s;white-space:nowrap;}
  nav button:hover{border-color:var(--accent);color:var(--accent);}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#000;}
  nav button.has-live{border-color:var(--live);color:var(--live);}

  main{max-width:1400px;margin:0 auto;padding:16px 10px;}

  /* Groups */
  .groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(660px,1fr));gap:20px;}
  .group-block{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .group-header{background:linear-gradient(90deg,var(--accent) 0%,#a07830 100%);padding:9px 14px;}
  .group-header h2{color:#000;font-size:.95rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;}

  .standings{width:100%;border-collapse:collapse;font-size:.77rem;}
  .standings thead tr{background:var(--card2);}
  .standings th{padding:6px 8px;text-align:center;color:var(--muted);font-weight:600;font-size:.67rem;text-transform:uppercase;}
  .standings th:first-child{text-align:left;padding-left:12px;}
  .standings td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);}
  .standings td:first-child{text-align:left;padding-left:12px;font-weight:600;}
  .standings tr.pos-1 td:first-child{border-left:3px solid var(--green);}
  .standings tr.pos-2 td:first-child{border-left:3px solid var(--blue);}
  .standings tr.pos-3 td:first-child{border-left:3px solid var(--accent);}
  .standings tr.pos-4 td:first-child{border-left:3px solid transparent;}
  .pts{font-weight:900;color:var(--accent2);}

  /* Match cards */
  .matches-list{padding:8px 10px;display:flex;flex-direction:column;gap:7px;}
  .match-card{background:var(--card2);border:1px solid var(--border);border-radius:9px;overflow:hidden;transition:border-color .2s;}
  .match-card.live-match{border-color:var(--live)!important;box-shadow:0 0 12px rgba(239,68,68,.2);}
  .match-card.finished{border-color:var(--border);}

  .match-main{display:grid;grid-template-columns:72px 1fr auto 1fr 95px;align-items:center;gap:7px;padding:9px 11px;cursor:pointer;}
  .match-meta{font-size:.64rem;color:var(--muted);line-height:1.5;}
  .match-team{font-size:.82rem;font-weight:700;}
  .team-home{text-align:right;}
  .team-away{text-align:left;}

  .score-area{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .score-display{font-size:1.1rem;font-weight:900;color:var(--accent2);min-width:54px;text-align:center;line-height:1;}
  .score-display.pending{color:var(--muted);font-size:.85rem;}
  .live-badge{font-size:.58rem;font-weight:700;color:var(--live);letter-spacing:.5px;display:flex;align-items:center;gap:3px;}
  .match-status-chip{font-size:.6rem;padding:1px 6px;border-radius:8px;font-weight:700;}
  .chip-live{background:rgba(239,68,68,.2);color:var(--live);}
  .chip-fin{background:rgba(34,197,94,.15);color:var(--green);}
  .chip-prox{background:var(--card3);color:var(--muted);}

  .match-venue-col{font-size:.63rem;color:var(--muted);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .expand-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.68rem;padding:2px 5px;border-radius:3px;}
  .expand-btn:hover{color:var(--text);}

  /* Stats panel */
  .stats-panel{display:none;border-top:1px solid var(--border);background:var(--card3);}
  .stats-panel.open{display:block;}
  .stats-inner{padding:12px 14px;}

  /* Goals list */
  .goals-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .goals-col h5{font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;text-align:center;}
  .goal-item{display:flex;align-items:center;gap:6px;font-size:.76rem;padding:3px 0;}
  .goal-min{color:var(--accent);font-weight:700;min-width:26px;font-size:.68rem;}
  .goal-name{flex:1;}
  .goal-type{font-size:.65rem;color:var(--muted);}
  .goals-col.home-side .goal-item{flex-direction:row-reverse;text-align:right;}
  .goals-col.home-side .goal-min{text-align:right;}
  .no-goals{font-size:.7rem;color:var(--muted);text-align:center;padding:5px 0;font-style:italic;}

  /* Stats bars */
  .stats-bars{background:var(--card2);border-radius:8px;padding:12px;}
  .stats-bars-title{font-size:.68rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;text-align:center;}
  .bar-row{margin-bottom:8px;}
  .bar-row-labels{display:flex;justify-content:space-between;font-size:.68rem;margin-bottom:3px;}
  .bar-row-labels .bar-home-val{font-weight:700;color:var(--text);}
  .bar-row-labels .bar-label{color:var(--muted);}
  .bar-row-labels .bar-away-val{font-weight:700;color:var(--text);}
  .bar-track{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--border);}
  .bar-home-fill{height:100%;background:var(--accent);border-radius:3px 0 0 3px;transition:width .5s;}
  .bar-away-fill{height:100%;background:var(--blue);border-radius:0 3px 3px 0;transition:width .5s;}

  /* Cards section */
  .cards-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .card-chip{font-size:.7rem;padding:3px 8px;border-radius:5px;font-weight:700;}
  .card-yellow{background:#3a2d00;color:#eab308;}
  .card-red{background:#3a0000;color:#ef4444;}
  .card-section-title{font-size:.68rem;color:var(--muted);margin-right:6px;}

  /* KO bracket */
  .bracket-section{margin-bottom:26px;}
  .bracket-title{font-size:.95rem;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-bottom:11px;padding-bottom:5px;border-bottom:1px solid var(--border);}
  .ko-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;}
  .ko-match{background:var(--card);border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .ko-match.live-match{border-color:var(--live);}
  .ko-match-header{background:var(--card2);padding:5px 11px;display:flex;justify-content:space-between;font-size:.64rem;color:var(--muted);}
  .ko-match-body{padding:9px 12px;}
  .ko-team-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;}
  .ko-team-row+.ko-team-row{border-top:1px solid var(--border);}
  .ko-team-name{font-size:.86rem;font-weight:700;flex:1;}
  .ko-score{font-size:1.1rem;font-weight:900;color:var(--accent2);min-width:28px;text-align:center;}
  .ko-winner{color:var(--accent2);}
  .ko-slot{font-size:.6rem;color:var(--muted);margin-top:5px;border-top:1px solid var(--border);padding-top:4px;}

  /* Scorers tab */
  .scorers-big-table{width:100%;border-collapse:collapse;font-size:.81rem;}
  .scorers-big-table th{background:var(--card2);padding:9px 12px;text-align:left;color:var(--muted);font-size:.68rem;text-transform:uppercase;}
  .scorers-big-table td{padding:8px 12px;border-bottom:1px solid var(--border);}
  .scorers-big-table tr:hover td{background:var(--card2);}
  .scorer-goals-num{font-size:1.1rem;font-weight:900;color:var(--accent);text-align:center;}
  .scorer-team-tag{font-size:.63rem;color:var(--muted);display:block;}

  /* Overview */
  .overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px;text-align:center;}
  .stat-num{font-size:2rem;font-weight:900;color:var(--accent);}
  .stat-label{font-size:.72rem;color:var(--muted);margin-top:2px;}

  .all-matches-table{width:100%;border-collapse:collapse;font-size:.78rem;}
  .all-matches-table th{background:var(--card2);padding:7px 9px;text-align:left;color:var(--muted);font-size:.67rem;text-transform:uppercase;}
  .all-matches-table td{padding:6px 9px;border-bottom:1px solid var(--border);}
  .all-matches-table tr:hover td{background:var(--card2);}
  .result-live{color:var(--live);font-weight:800;}
  .result-fin{color:var(--accent2);font-weight:800;}
  .result-pending{color:var(--muted);}

  .section-title{font-size:.88rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}

  .legend{display:flex;gap:12px;font-size:.68rem;color:var(--muted);padding:6px 0;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:3px;}
  .dot{width:8px;height:8px;border-radius:2px;}

  .clear-btn{background:#7f1d1d;border:1px solid var(--red);color:#fca5a5;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:.74rem;font-weight:600;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#000;padding:9px 16px;border-radius:8px;font-weight:700;font-size:.82rem;z-index:9999;animation:slideIn .3s ease;}
  @keyframes slideIn{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}

  .loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:12px;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:8px;padding:14px 18px;color:#fca5a5;font-size:.82rem;margin:12px 0;}

  @media(max-width:700px){
    .groups-grid{grid-template-columns:1fr;}
    .match-main{grid-template-columns:58px 1fr auto 1fr;}
    .match-venue-col{display:none;}
    header{padding:10px 12px;}
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>⚽ Copa Mundial FIFA 2026</h1>
    <p>11 jun – 19 jul · Canadá, México &amp; Estados Unidos · 104 partidos</p>
  </div>
  <div class="header-right">
    <div class="sync-status" id="syncStatus">
      <span id="syncDot" style="display:none" class="live-dot"></span>
      <span id="syncText">–</span>
    </div>
    <button class="sync-btn" id="syncBtn" onclick="fetchFromFIFA(true)">
      🔄 Actualizar
    </button>
  </div>
</header>

<nav id="mainNav">
  <button class="active" onclick="showTab('resumen')">Resumen</button>
  <button onclick="showTab('goleadores')">⚽ Goleadores</button>
  <button onclick="showTab('grupo-A')">Grupo A</button>
  <button onclick="showTab('grupo-B')">Grupo B</button>
  <button onclick="showTab('grupo-C')">Grupo C</button>
  <button onclick="showTab('grupo-D')">Grupo D</button>
  <button onclick="showTab('grupo-E')">Grupo E</button>
  <button onclick="showTab('grupo-F')">Grupo F</button>
  <button onclick="showTab('grupo-G')">Grupo G</button>
  <button onclick="showTab('grupo-H')">Grupo H</button>
  <button onclick="showTab('grupo-I')">Grupo I</button>
  <button onclick="showTab('grupo-J')">Grupo J</button>
  <button onclick="showTab('grupo-K')">Grupo K</button>
  <button onclick="showTab('grupo-L')">Grupo L</button>
  <button onclick="showTab('eliminatoria')">Eliminatoria</button>
</nav>

<main id="mainContent">
  <div class="loading-overlay"><div class="spinner"></div><p style="color:var(--muted)">Cargando datos de FIFA…</p></div>
</main>

<script>
// ═══════════════════════════════════════════════════════
// FIFA API CONFIG
// ═══════════════════════════════════════════════════════
const FIFA_API   = 'https://api.fifa.com/api/v3';
const ID_COMP    = '17';
const ID_SEASON  = '285023';  // Copa Mundial FIFA 2026
const REFRESH_MS = 60_000;    // auto-refresh cada 60 s

// MatchStatus values: 0=Finalizado, 1=Próximo, 3=En juego, 12=En juego (ET), ...
const STATUS_LIVE     = new Set([3, 4, 5, 6, 7, 12, 13]);
const STATUS_FINISHED = new Set([0]);

// Event types for goals
const GOAL_TYPES   = new Set([0, 1, 3, 4, 41, 42]);  // gol, autogol, penal, etc.
const OWN_GOAL     = new Set([1, 4]);
const PENALTY_GOAL = new Set([41, 42]);

const FLAGS = {
  MEX:'🇲🇽', RSA:'🇿🇦', KOR:'🇰🇷', CZE:'🇨🇿',
  CAN:'🇨🇦', BIH:'🇧🇦', QAT:'🇶🇦', SUI:'🇨🇭',
  BRA:'🇧🇷', MAR:'🇲🇦', HAI:'🇭🇹', SCO:'🏴󠁧󠁢󠁳󠁣󠁴󠁿',
  USA:'🇺🇸', PAR:'🇵🇾', AUS:'🇦🇺', TUR:'🇹🇷',
  GER:'🇩🇪', CUW:'🇨🇼', CIV:'🇨🇮', ECU:'🇪🇨',
  NED:'🇳🇱', JPN:'🇯🇵', SWE:'🇸🇪', TUN:'🇹🇳',
  BEL:'🇧🇪', EGY:'🇪🇬', IRN:'🇮🇷', NZL:'🇳🇿',
  ESP:'🇪🇸', CPV:'🇨🇻', KSA:'🇸🇦', URU:'🇺🇾',
  FRA:'🇫🇷', SEN:'🇸🇳', IRQ:'🇮🇶', NOR:'🇳🇴',
  ARG:'🇦🇷', ALG:'🇩🇿', AUT:'🇦🇹', JOR:'🇯🇴',
  POR:'🇵🇹', COD:'🇨🇩', UZB:'🇺🇿', COL:'🇨🇴',
  ENG:'🏴󠁧󠁢󠁥󠁮󠁧󠁿', CRO:'🇭🇷', GHA:'🇬🇭', PAN:'🇵🇦',
};
const f = (iso) => (FLAGS[iso]||'🏳') + ' ';

const GROUPS = {
  A:['MEX','KOR','CZE','RSA'], B:['CAN','QAT','SUI','BIH'],
  C:['BRA','MAR','HAI','SCO'], D:['USA','PAR','AUS','TUR'],
  E:['GER','CUW','CIV','ECU'], F:['NED','JPN','SWE','TUN'],
  G:['BEL','EGY','IRN','NZL'], H:['ESP','CPV','KSA','URU'],
  I:['FRA','SEN','IRQ','NOR'], J:['ARG','ALG','AUT','JOR'],
  K:['POR','COD','UZB','COL'], L:['ENG','CRO','GHA','PAN'],
};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let fifaMatches  = JSON.parse(localStorage.getItem('wc26_matches') || '[]');
let fifaScorers  = JSON.parse(localStorage.getItem('wc26_scorers') || '{}'); // idMatch → events
let lastSync     = parseInt(localStorage.getItem('wc26_lastSync') || '0');
let currentTab   = 'resumen';
let openPanels   = new Set();
let refreshTimer = null;

function saveState() {
  localStorage.setItem('wc26_matches',  JSON.stringify(fifaMatches));
  localStorage.setItem('wc26_scorers',  JSON.stringify(fifaScorers));
  localStorage.setItem('wc26_lastSync', String(Date.now()));
  lastSync = Date.now();
}

// ═══════════════════════════════════════════════════════
// FIFA FETCH
// ═══════════════════════════════════════════════════════
async function fetchFromFIFA(manual = false) {
  const btn = document.getElementById('syncBtn');
  const st  = document.getElementById('syncText');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Actualizando…'; }

  try {
    const url = `${FIFA_API}/calendar/matches?idCompetition=${ID_COMP}&idSeason=${ID_SEASON}&count=104&language=es`;
    const res = await fetch(url, { headers: { 'Origin': 'https://www.fifa.com' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    fifaMatches = data.Results || [];
    saveState();
    setSyncStatus('ok');
    if (manual) toast('✅ Datos actualizados desde FIFA');

    // Fetch scorers for live and recently finished matches
    await fetchLiveScorers();
    renderCurrentTab();
    scheduleNextRefresh();
  } catch (e) {
    setSyncStatus('error');
    if (manual) toast('⚠️ Error al conectar con FIFA. Usando datos en caché.');
    if (fifaMatches.length) renderCurrentTab();
    else renderError(e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Actualizar'; }
  }
}

async function fetchLiveScorers() {
  const toFetch = fifaMatches.filter(m =>
    STATUS_LIVE.has(m.MatchStatus) || STATUS_FINISHED.has(m.MatchStatus)
  );
  // Parallel fetch but limit to avoid hammering
  const chunks = [];
  for (let i = 0; i < toFetch.length; i += 6) chunks.push(toFetch.slice(i, i+6));
  for (const chunk of chunks) {
    await Promise.allSettled(chunk.map(async m => {
      if (fifaScorers[m.IdMatch] && !STATUS_LIVE.has(m.MatchStatus)) return; // cached
      try {
        const url = `${FIFA_API}/timelines/${ID_COMP}/${ID_SEASON}/${m.IdStage}/${m.IdMatch}?language=es`;
        const r = await fetch(url, { headers: { 'Origin': 'https://www.fifa.com' } });
        if (!r.ok) return;
        const d = await r.json();
        fifaScorers[m.IdMatch] = extractGoals(d.Event || [], m);
      } catch {}
    }));
  }
  localStorage.setItem('wc26_scorers', JSON.stringify(fifaScorers));
}

function extractGoals(events, match) {
  const goals = [];
  let prevH = 0, prevA = 0;
  for (const e of events) {
    const h = e.HomeGoals || 0, a = e.AwayGoals || 0;
    if (h > prevH || a > prevA) {
      const isHome = (h > prevH);
      const typeId = e.Type;
      const own = OWN_GOAL.has(typeId);
      const pen = PENALTY_GOAL.has(typeId);
      // Extract player name from EventDescription
      let name = '';
      for (const ed of (e.EventDescription || [])) {
        const m2 = ed.Description?.match(/^¡?([A-ZÁÉÍÓÚÜÑ\s\.]+)\s*\(/);
        if (m2) { name = m2[1].trim(); break; }
      }
      goals.push({
        min: e.MatchMinute || '?',
        name,
        side: isHome ? 'home' : 'away',
        own, pen,
        scoreH: h, scoreA: a,
        idTeam: e.IdTeam,
      });
      prevH = h; prevA = a;
    }
  }
  return goals;
}

function scheduleNextRefresh() {
  clearTimeout(refreshTimer);
  const hasLive = fifaMatches.some(m => STATUS_LIVE.has(m.MatchStatus));
  const delay = hasLive ? 30_000 : REFRESH_MS;
  refreshTimer = setTimeout(() => fetchFromFIFA(false), delay);
  updateSyncDot(hasLive);
}

function setSyncStatus(state) {
  const el = document.getElementById('syncText');
  if (!el) return;
  if (state === 'ok') {
    const d = new Date();
    el.textContent = `FIFA · ${d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}`;
  } else {
    el.textContent = 'Sin conexión · caché';
  }
}
function updateSyncDot(live) {
  const dot = document.getElementById('syncDot');
  if (dot) dot.style.display = live ? 'inline-block' : 'none';
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function getLocale(arr, locale='es') {
  if (!Array.isArray(arr)) return arr || '';
  return (arr.find(x=>x.Locale?.startsWith(locale))||arr[0]||{}).Description || '';
}

function getMatchGroup(m) {
  const stage = getLocale(m.StageName);
  const group = getLocale(m.GroupName);
  if (/primera fase|group stage/i.test(stage)) {
    const letter = group.match(/Grupo\s+([A-L])/i)?.[1] || group.match(/Group\s+([A-L])/i)?.[1];
    return letter ? letter.toUpperCase() : null;
  }
  if (/dieciseis/i.test(stage)) return 'Dieciseisavos';
  if (/octavo/i.test(stage)) return 'Octavos';
  if (/cuarto/i.test(stage)) return 'Cuartos';
  if (/semifinal/i.test(stage)) return 'Semifinal';
  if (/tercer/i.test(stage)) return 'Tercer puesto';
  if (/^final$/i.test(stage)) return 'Final';
  return stage;
}

function matchStatus(m) {
  if (STATUS_LIVE.has(m.MatchStatus)) return 'live';
  if (STATUS_FINISHED.has(m.MatchStatus)) return 'fin';
  return 'prox';
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  return `${days[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════════════
// STANDINGS
// ═══════════════════════════════════════════════════════
function calcStandings(group) {
  const isos = GROUPS[group] || [];
  const t = {};
  isos.forEach(iso => { t[iso]={iso,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}; });

  const ms = fifaMatches.filter(m => getMatchGroup(m) === group && STATUS_FINISHED.has(m.MatchStatus));
  ms.forEach(m => {
    const h = m.HomeTeamScore, a = m.AwayTeamScore;
    if (h === null || a === null) return;
    const hiso = m.Home.IdCountry, aiso = m.Away.IdCountry;
    if (!t[hiso] || !t[aiso]) return;
    t[hiso].p++; t[aiso].p++;
    t[hiso].gf+=h; t[hiso].ga+=a;
    t[aiso].gf+=a; t[aiso].ga+=h;
    t[hiso].gd+=h-a; t[aiso].gd+=a-h;
    if (h>a){t[hiso].w++;t[aiso].l++;t[hiso].pts+=3;}
    else if(h<a){t[aiso].w++;t[hiso].l++;t[aiso].pts+=3;}
    else{t[hiso].d++;t[aiso].d++;t[hiso].pts++;t[aiso].pts++;}
  });

  return Object.values(t).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.iso.localeCompare(b.iso));
}

// ═══════════════════════════════════════════════════════
// SCORERS aggregation
// ═══════════════════════════════════════════════════════
function buildScorers() {
  const map = {};
  Object.entries(fifaScorers).forEach(([matchId, goals]) => {
    const match = fifaMatches.find(m => m.IdMatch === matchId);
    if (!match) return;
    goals.forEach(g => {
      if (!g.name) return;
      const scoringIso = g.own
        ? (g.side==='home' ? match.Away.IdCountry : match.Home.IdCountry)
        : (g.side==='home' ? match.Home.IdCountry : match.Away.IdCountry);
      const key = g.name + '|' + scoringIso;
      if (!map[key]) map[key] = {name:g.name, iso:scoringIso, goals:0, matches:new Set()};
      map[key].goals++;
      map[key].matches.add(matchId);
    });
  });
  return Object.values(map)
    .map(p=>({...p, matchCount: p.matches.size}))
    .sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name));
}

// ═══════════════════════════════════════════════════════
// TEAM NAME helper
// ═══════════════════════════════════════════════════════
function teamName(teamObj) {
  if (!teamObj) return '?';
  const loc = getLocale(teamObj.TeamName);
  return loc || teamObj.Abbreviation || teamObj.IdCountry || '?';
}

// ═══════════════════════════════════════════════════════
// RENDER MATCH CARD
// ═══════════════════════════════════════════════════════
function renderMatchCard(m) {
  const status = matchStatus(m);
  const hScore = m.HomeTeamScore;
  const aScore = m.AwayTeamScore;
  const hName  = m.Home ? teamName(m.Home) : (m.PlaceHolderA||'Por definir');
  const aName  = m.Away ? teamName(m.Away) : (m.PlaceHolderB||'Por definir');
  const hIso   = m.Home?.IdCountry || '';
  const aIso   = m.Away?.IdCountry || '';
  const goals  = fifaScorers[m.IdMatch] || [];
  const homeGoals = goals.filter(g=>g.side==='home');
  const awayGoals = goals.filter(g=>g.side==='away');
  const poss  = m.BallPossession;
  const date  = formatDate(m.LocalDate || m.Date);
  const time  = formatTime(m.LocalDate || m.Date);
  const matchTime = m.MatchTime ? `${m.MatchTime}'` : '';

  // Score display
  let scoreHtml;
  if (status === 'prox') {
    scoreHtml = `<div class="score-display pending" style="font-size:.95rem;line-height:1.3">${time}</div>
      <div style="font-size:.65rem;color:var(--accent);font-weight:700;text-align:center">${date}</div>
      <span class="match-status-chip chip-prox" style="margin-top:2px">Próximo</span>`;
  } else if (status === 'live') {
    scoreHtml = `<div class="score-display">${hScore ?? '?'} – ${aScore ?? '?'}</div>
      <div class="live-badge"><span class="live-dot"></span>${matchTime||'EN VIVO'}</div>`;
  } else {
    scoreHtml = `<div class="score-display">${hScore} – ${aScore}</div>
      <span class="match-status-chip chip-fin">Final</span>`;
  }

  // Goal scorers display (home side reversed)
  const goalItem = (g, side) => {
    const type = g.pen ? ' (P)' : g.own ? ' (PP)' : '';
    return `<div class="goal-item"><span class="goal-min">${g.min}</span>
      <span class="goal-name">${g.name||'–'}${type}</span></div>`;
  };

  const hasStats = poss || m.Attendance;

  // Build stats bars
  const hPoss = poss?.OverallHome ? Math.round(poss.OverallHome) : null;
  const aPoss = poss?.OverallAway ? Math.round(poss.OverallAway) : null;

  const barHtml = (hv, av, label) => {
    if (hv === null && av === null) return '';
    const total = (hv||0)+(av||0);
    const hPct = total > 0 ? Math.round((hv||0)/total*100) : 50;
    const aPct = 100 - hPct;
    return `<div class="bar-row">
      <div class="bar-row-labels">
        <span class="bar-home-val">${hv!==null?hv:'-'}</span>
        <span class="bar-label">${label}</span>
        <span class="bar-away-val">${av!==null?av:'-'}</span>
      </div>
      <div class="bar-track">
        <div class="bar-home-fill" style="width:${hPct}%"></div>
        <div class="bar-away-fill" style="width:${aPct}%"></div>
      </div>
    </div>`;
  };

  const statsSection = (status !== 'prox') ? `
    <div class="stats-inner">
      <!-- Goals -->
      ${(homeGoals.length || awayGoals.length) ? `
      <div class="goals-row">
        <div class="goals-col home-side">
          <h5>${f(hIso)}${hName}</h5>
          ${homeGoals.length ? homeGoals.map(g=>goalItem(g,'home')).join('') : '<div class="no-goals">Sin goles</div>'}
        </div>
        <div class="goals-col">
          <h5>${f(aIso)}${aName}</h5>
          ${awayGoals.length ? awayGoals.map(g=>goalItem(g,'away')).join('') : '<div class="no-goals">Sin goles</div>'}
        </div>
      </div>` : '<div style="font-size:.72rem;color:var(--muted);text-align:center;margin-bottom:12px">Sin datos de goleadores aún</div>'}

      <!-- Possession bar -->
      ${hPoss !== null ? `
      <div class="stats-bars">
        <div class="stats-bars-title">${f(hIso)}${hName} vs ${aName}${f(aIso)}</div>
        ${barHtml(hPoss, aPoss, 'Posesión %')}
        ${m.Attendance ? `<div style="text-align:center;font-size:.68rem;color:var(--muted);margin-top:6px">Asistencia: ${parseInt(m.Attendance).toLocaleString('es')}</div>` : ''}
      </div>` : ''}

      ${m.Attendance && !hPoss ? `<div style="text-align:center;font-size:.7rem;color:var(--muted);margin-top:6px">Asistencia: ${parseInt(m.Attendance).toLocaleString('es')}</div>` : ''}
    </div>` : `<div style="padding:10px 14px;font-size:.72rem;color:var(--muted);text-align:center">El partido aún no ha comenzado</div>`;

  return `
  <div class="match-card ${status === 'live' ? 'live-match' : ''}" id="mc-${m.IdMatch}">
    <div class="match-main" onclick="togglePanel('${m.IdMatch}')">
      <div class="match-meta">${date}<br>#${m.MatchNumber||'?'}</div>
      <div class="match-team team-home">${f(hIso)}${hName}</div>
      <div class="score-area">${scoreHtml}</div>
      <div class="match-team team-away">${aName}${f(aIso)}</div>
      <div class="match-venue-col">
        <span>${getLocale(m.Stadium?.CityName)||''}</span>
        <button class="expand-btn" id="eb-${m.IdMatch}">${openPanels.has(m.IdMatch)?'▼':'▶'}</button>
      </div>
    </div>
    <div class="stats-panel ${openPanels.has(m.IdMatch)?'open':''}" id="sp-${m.IdMatch}">
      ${statsSection}
    </div>
  </div>`;
}

function togglePanel(id) {
  if (openPanels.has(id)) openPanels.delete(id);
  else openPanels.add(id);
  const p = document.getElementById('sp-'+id);
  const b = document.getElementById('eb-'+id);
  if (p) p.classList.toggle('open', openPanels.has(id));
  if (b) b.textContent = openPanels.has(id) ? '▼' : '▶';
}

}

function renderEliminatoria() {
  const KO = ['Dieciseisavos','Octavos','Cuartos','Semifinal','Tercer puesto','Final'];
  return KO.map(phase => {
    const ms = fifaMatches.filter(m=>getMatchGroup(m)===phase)
      .sort((a,b)=>new Date(a.Date)-new Date(b.Date));
    if (!ms.length) return '';
    const cards = ms.map(m => {
      const st = matchStatus(m);
      const h = m.HomeTeamScore, a = m.AwayTeamScore;
      const hN = m.Home ? teamName(m.Home) : (m.PlaceHolderA||'?');
      const aN = m.Away ? teamName(m.Away) : (m.PlaceHolderB||'?');
      const hIso = m.Home?.IdCountry||'';
      const aIso = m.Away?.IdCountry||'';
      const hW = st!=='prox'&&h!==null&&a!==null&&h>a;
      const aW = st!=='prox'&&h!==null&&a!==null&&a>h;
      return `
      <div class="ko-match ${st==='live'?'live-match':''}">
        <div class="ko-match-header">
          <span>${formatDate(m.LocalDate||m.Date)} ${formatTime(m.LocalDate||m.Date)}</span>
          <span>${getLocale(m.Stadium?.CityName)||''}</span>
        </div>
        <div class="ko-match-body">
          <div class="ko-team-row">
            <span class="ko-team-name ${hW?'ko-winner':''}">${f(hIso)}${hN}</span>
            <span class="ko-score">${h!==null?h:'–'}</span>
          </div>
          <div class="ko-team-row">
            <span class="ko-team-name ${aW?'ko-winner':''}">${f(aIso)}${aN}</span>
            <span class="ko-score">${a!==null?a:'–'}</span>
          </div>
          ${(!m.Home&&m.PlaceHolderA)?`<div class="ko-slot">${m.PlaceHolderA} vs ${m.PlaceHolderB}</div>`:''}

    }).join('');
    return `<div class="bracket-section"><div class="bracket-title">${phase}</div><div class="ko-grid">${cards}</div></div>`;

}

  document.getElementById('mainContent').innerHTML = `
    <div class="error-box">⚠️ Error al cargar datos: ${msg}<br>
    <button onclick="fetchFromFIFA(true)" style="margin-top:8px;padding:5px 12px;background:var(--accent);border:none;border-radius:5px;font-weight:700;cursor:pointer;color:#000">Reintentar</button></div>`;
}

// ═══════════════════════════════════════════════════════
// TAB ROUTING
// ═══════════════════════════════════════════════════════
function showTab(tabId) {
  currentTab = tabId;
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick').includes(`'${tabId}'`));
  });
  renderCurrentTab();
}

function renderCurrentTab() {
  const main = document.getElementById('mainContent');
  if (!fifaMatches.length) return;
  // Mark live tabs
  document.querySelectorAll('nav button').forEach(b => {
    const m = b.getAttribute('onclick')?.match(/'grupo-([A-L])'/);
    if (m) {
      const hasLive = fifaMatches.some(x=>getMatchGroup(x)===m[1]&&STATUS_LIVE.has(x.MatchStatus));
      b.classList.toggle('has-live', hasLive);
    }
  });

  if (currentTab === 'resumen') main.innerHTML = renderResumen();
  else if (currentTab === 'goleadores') main.innerHTML = renderGoleadores();
  else if (currentTab === 'eliminatoria') main.innerHTML = renderEliminatoria();
  else if (currentTab.startsWith('grupo-')) {
    const g = currentTab.replace('grupo-','');
    main.innerHTML = `<div class="groups-grid">${renderGroupTabFixed(g)}</div>`;
  }
}

function clearCache() {
  if (!confirm('¿Borrar la caché de datos? Se volverán a descargar de FIFA.')) return;
  fifaMatches=[]; fifaScorers={}; lastSync=0;
  localStorage.removeItem('wc26_matches');
  localStorage.removeItem('wc26_scorers');
  localStorage.removeItem('wc26_lastSync');
  document.getElementById('mainContent').innerHTML=`<div class="loading-overlay"><div class="spinner"></div><p style="color:var(--muted)">Recargando…</p></div>`;
  fetchFromFIFA(true);
}

function toast(msg) {
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
const CACHE_TTL = 5 * 60 * 1000; // 5 minutos

(async () => {
  const cacheAge = Date.now() - lastSync;
  if (fifaMatches.length && cacheAge < CACHE_TTL) {
    // Use cache but also show data
    setSyncStatus('ok');
    const d = new Date(lastSync);
    document.getElementById('syncText').textContent =
      `FIFA · ${d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}`;
    renderCurrentTab();
    // Refresh in background
    setTimeout(() => fetchFromFIFA(false), 2000);
  } else {
    await fetchFromFIFA(false);
  }
})();
</script>
</body>
</html>
